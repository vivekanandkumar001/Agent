<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Clamp Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom scrollbar for textarea */
    textarea::-webkit-scrollbar {
      width: 8px;
    }
    textarea::-webkit-scrollbar-thumb {
      background-color: #cbd5e0;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <div id="ad-slot-header" class="my-4 text-center p-4 bg-gray-100 rounded border border-dashed border-gray-300 text-xs text-gray-500">Sponsored Ad Space</div>

  <main class="flex-1 max-w-4xl mx-auto p-4 space-y-8">
    <header class="text-center">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">CSS Clamp Calculator</h1>
      <p class="text-gray-600">Generate fluid CSS <code class="bg-gray-200 rounded px-1">clamp()</code> values for responsive typography and spacing.</p>
    </header>

    <!-- Input Section -->
    <section class="bg-white rounded-lg shadow p-6 space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Minimum Size -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="min-size">Minimum Size</label>
          <div class="flex items-center space-x-2">
            <input type="number" id="min-size" class="flex-1 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value="16" step="0.1">
            <select id="min-unit" class="border rounded px-2 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="px">px</option>
              <option value="rem">rem</option>
              <option value="vw">vw</option>
            </select>
          </div>
        </div>
        <!-- Maximum Size -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="max-size">Maximum Size</label>
          <div class="flex items-center space-x-2">
            <input type="number" id="max-size" class="flex-1 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value="24" step="0.1">
            <select id="max-unit" class="border rounded px-2 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="px">px</option>
              <option value="rem">rem</option>
              <option value="vw">vw</option>
            </select>
          </div>
        </div>
        <!-- Minimum Viewport Width -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="min-vw">Min Viewport Width (px)</label>
          <input type="range" id="min-vw-slider" min="320" max="1440" step="1" value="320" class="w-full">
          <input type="number" id="min-vw" class="mt-2 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value="320" min="320" max="1440">
        </div>
        <!-- Maximum Viewport Width -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="max-vw">Max Viewport Width (px)</label>
          <input type="range" id="max-vw-slider" min="320" max="2560" step="1" value="1440" class="w-full">
          <input type="number" id="max-vw" class="mt-2 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value="1440" min="320" max="2560">
        </div>
        <!-- Root Font Size (for rem) -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="root-font">Root Font Size (px)</label>
          <input type="number" id="root-font" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value="16" step="0.1">
        </div>
      </div>
    </section>

    <!-- Preview Section -->
    <section class="bg-white rounded-lg shadow p-6 space-y-4">
      <h2 class="text-xl font-semibold text-gray-800">Live Preview</h2>
      <div class="border border-gray-200 rounded p-4 overflow-x-auto">
        <p id="preview-text" class="text-gray-800">The quick brown fox jumps over the lazy dog.</p>
      </div>
      <p class="text-sm text-gray-500">Resize the browser window to see the fluid scaling in action.</p>
    </section>

    <!-- Output Section -->
    <section class="bg-white rounded-lg shadow p-6 space-y-4">
      <h2 class="text-xl font-semibold text-gray-800">Generated CSS</h2>
      <textarea id="css-output" class="w-full h-32 border rounded p-3 text-sm font-mono resize-none focus:outline-none focus:ring-2 focus:ring-blue-500" readonly></textarea>
      <button id="copy-btn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">Copy to Clipboard</button>
    </section>
  </main>

  <div id="ad-slot-footer" class="my-4 text-center p-4 bg-gray-100 rounded border border-dashed border-gray-300 text-xs text-gray-500">Sponsored Ad Space</div>

  <footer class="text-center text-sm text-gray-500 py-4">
    Built with <a href="https://n8n.io" target="_blank" rel="noopener" class="text-blue-600 hover:underline font-medium">AI Asset Engine</a>
  </footer>

  <script>
    // Utility functions
    const toPx = (value, unit, root) => {
      if (unit === 'px') return value;
      if (unit === 'rem') return value * root;
      if (unit === 'vw') return (value / 100) * window.innerWidth;
      return value;
    };
    const fromPx = (px, unit, root) => {
      if (unit === 'px') return px;
      if (unit === 'rem') return px / root;
      if (unit === 'vw') return (px / window.innerWidth) * 100;
      return px;
    };
    const formatValue = (num) => {
      return Number.isInteger(num) ? num : num.toFixed(2);
    };

    // Element references
    const minSizeEl = document.getElementById('min-size');
    const maxSizeEl = document.getElementById('max-size');
    const minUnitEl = document.getElementById('min-unit');
    const maxUnitEl = document.getElementById('max-unit');
    const minVwEl = document.getElementById('min-vw');
    const maxVwEl = document.getElementById('max-vw');
    const minVwSlider = document.getElementById('min-vw-slider');
    const maxVwSlider = document.getElementById('max-vw-slider');
    const rootFontEl = document.getElementById('root-font');
    const previewEl = document.getElementById('preview-text');
    const cssOutputEl = document.getElementById('css-output');
    const copyBtn = document.getElementById('copy-btn');

    // Sync sliders & number inputs
    const syncSlider = (slider, input) => {
      slider.value = input.value;
    };
    const syncInput = (input, slider) => {
      input.value = slider.value;
    };

    // Main calculation
    const updateClamp = () => {
      const root = parseFloat(rootFontEl.value) || 16;
      const minSize = parseFloat(minSizeEl.value) || 0;
      const maxSize = parseFloat(maxSizeEl.value) || 0;
      const minUnit = minUnitEl.value;
      const maxUnit = maxUnitEl.value;
      const minVw = parseInt(minVwEl.value) || 320;
      const maxVw = parseInt(maxVwEl.value) || 1440;

      // Convert sizes to px for calculation
      const minPx = toPx(minSize, minUnit, root);
      const maxPx = toPx(maxSize, maxUnit, root);

      const slope = (maxPx - minPx) / (maxVw - minVw);
      const yIntercept = minPx - slope * minVw;

      // Build clamp expression
      const minStr = `${formatValue(minSize)}${minUnit}`;
      const maxStr = `${formatValue(maxSize)}${maxUnit}`;
      const vwCalc = `${formatValue(slope * 100)}vw`;
      const base = `${formatValue(yIntercept)}px`;

      const clampExpr = `clamp(${minStr}, calc(${base} + ${vwCalc}), ${maxStr})`;

      // Apply to preview
      previewEl.style.fontSize = clampExpr;

      // Output CSS (example usage)
      const cssCode = `/* Fluid font size */\nfont-size: ${clampExpr};`;
      cssOutputEl.value = cssCode;
    };

    // Event listeners
    const inputs = [minSizeEl, maxSizeEl, minUnitEl, maxUnitEl, minVwEl, maxVwEl, rootFontEl];
    inputs.forEach(el => el.addEventListener('input', () => {
      // Keep sliders in sync
      syncSlider(minVwSlider, minVwEl);
      syncSlider(maxVwSlider, maxVwEl);
      updateClamp();
    }));

    // Slider listeners
    minVwSlider.addEventListener('input', () => {
      syncInput(minVwEl, minVwSlider);
      updateClamp();
    });
    maxVwSlider.addEventListener('input', () => {
      syncInput(maxVwEl, maxVwSlider);
      updateClamp();
    });

    // Copy to clipboard
    copyBtn.addEventListener('click', () => {
      cssOutputEl.select();
      navigator.clipboard.writeText(cssOutputEl.value).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy to Clipboard'; }, 1500);
      });
    });

    // Initial run
    updateClamp();

    // Recalculate on window resize (for vw unit accuracy)
    window.addEventListener('resize', updateClamp);
  </script>
</body>
</html>
